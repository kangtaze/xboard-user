<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1024px;
  height: 500px;
  overflow: hidden;
  font-family: 'Inter', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(135deg, #f0f7ff 0%, #e8f4fd 30%, #f8fbff 60%, #eef5ff 100%);
  position: relative;
}

/* Decorative background elements */
.bg-circle-1 {
  position: absolute;
  width: 300px; height: 300px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(37,99,235,0.06) 0%, transparent 70%);
  top: -80px; right: -60px;
}
.bg-circle-2 {
  position: absolute;
  width: 200px; height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(59,130,246,0.08) 0%, transparent 70%);
  bottom: -40px; left: -30px;
}
.bg-dots {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: radial-gradient(circle, rgba(37,99,235,0.04) 1px, transparent 1px);
  background-size: 24px 24px;
}

/* Main content */
.container {
  position: relative;
  z-index: 1;
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  padding: 0 60px;
}

/* Left side: Logo + Text */
.left {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.logo-area {
  display: flex;
  align-items: center;
  gap: 16px;
}

.logo-icon {
  width: 72px; height: 72px;
  background: linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #60a5fa 100%);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 16px rgba(37,99,235,0.25);
}

.logo-icon svg {
  width: 40px; height: 40px;
}

.brand-name {
  font-size: 36px;
  font-weight: 800;
  color: #1e3a5f;
  letter-spacing: -0.5px;
}

.brand-subtitle {
  font-size: 14px;
  color: #64748b;
  font-weight: 500;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-top: -4px;
}

.tagline {
  font-size: 22px;
  color: #334155;
  font-weight: 600;
  line-height: 1.4;
  max-width: 480px;
}

.tagline span {
  color: #2563eb;
}

.website-url {
  font-size: 16px;
  color: #2563eb;
  font-weight: 700;
  letter-spacing: 0.5px;
  margin-top: -4px;
}

/* Feature pills */
.features {
  display: flex;
  gap: 12px;
  margin-top: 8px;
}

.pill {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(37,99,235,0.08);
  border: 1px solid rgba(37,99,235,0.15);
  border-radius: 100px;
  padding: 6px 16px;
  font-size: 13px;
  color: #2563eb;
  font-weight: 600;
}

.pill svg {
  width: 16px; height: 16px;
}

/* Right side: Phone mockup with REAL screenshot */
.right {
  flex-shrink: 0;
  margin-left: 40px;
}

.phone-frame {
  width: 220px;
  height: 440px;
  background: #1a1a2e;
  border-radius: 32px;
  padding: 8px;
  box-shadow:
    0 20px 60px rgba(0,0,0,0.15),
    0 4px 16px rgba(0,0,0,0.08),
    inset 0 1px 0 rgba(255,255,255,0.1);
  position: relative;
  overflow: hidden;
}

.phone-screen {
  width: 100%;
  height: 100%;
  border-radius: 24px;
  overflow: hidden;
  background: white;
}

.phone-screen img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Phone notch */
.phone-notch {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 80px;
  height: 20px;
  background: #1a1a2e;
  border-radius: 0 0 12px 12px;
  z-index: 2;
}

/* Bottom: badge */
.bottom-badge {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 48px;
  background: linear-gradient(90deg, #2563eb 0%, #3b82f6 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
}

.badge-item {
  display: flex;
  align-items: center;
  gap: 6px;
  color: white;
  font-size: 13px;
  font-weight: 600;
}

.badge-item svg { width: 18px; height: 18px; }
.badge-number { font-size: 18px; font-weight: 800; }
</style>
</head>
<body>

</body>
