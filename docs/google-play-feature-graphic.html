<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1024px;
  height: 500px;
  overflow: hidden;
  font-family: 'Inter', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(135deg, #f0f7ff 0%, #e8f4fd 30%, #f8fbff 60%, #eef5ff 100%);
  position: relative;
}

/* Decorative background */
.bg-circle-1 {
  position: absolute;
  width: 350px; height: 350px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(37,99,235,0.06) 0%, transparent 70%);
  top: -120px; right: -60px;
}
.bg-circle-2 {
  position: absolute;
  width: 250px; height: 250px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(59,130,246,0.08) 0%, transparent 70%);
  bottom: -80px; left: -40px;
}
.bg-dots {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: radial-gradient(circle, rgba(37,99,235,0.04) 1px, transparent 1px);
  background-size: 24px 24px;
}

/* Main layout */
.container {
  position: relative;
  z-index: 1;
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  padding: 0 50px;
}

/* Left column */
.left {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* Logo area */
.logo-area {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-img {
  width: 52px;
  height: 52px;
  object-fit: contain;
}

.brand-name {
  font-size: 26px;
  font-weight: 800;
  color: #1e3a5f;
}

.brand-subtitle {
  font-size: 11px;
  color: #64748b;
  font-weight: 500;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.website-url {
  font-size: 14px;
  color: #2563eb;
  font-weight: 700;
  letter-spacing: 0.5px;
}

/* Tagline */
.tagline {
  font-size: 19px;
  color: #334155;
  font-weight: 600;
  line-height: 1.4;
  max-width: 420px;
}

.tagline .highlight {
  color: #2563eb;
}

/* Unlock badge */
.unlock-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: linear-gradient(135deg, rgba(37,99,235,0.08), rgba(139,92,246,0.08));
  border: 1px solid rgba(37,99,235,0.18);
  border-radius: 100px;
  padding: 6px 16px;
  font-size: 13px;
  color: #2563eb;
  font-weight: 600;
  width: fit-content;
}

.unlock-badge svg { width: 18px; height: 18px; color: #2563eb; }

/* Streaming icons row */
.streaming-row {
  display: flex;
  gap: 8px;
  margin-top: 2px;
}

.stream-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.stream-icon svg {
  width: 22px;
  height: 22px;
}

.stream-icon .unlock-check {
  position: absolute;
  top: -4px;
  right: -4px;
  width: 16px;
  height: 16px;
  background: #22c55e;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #f0f7ff;
}

.stream-icon .unlock-check svg {
  width: 10px;
  height: 10px;
  color: white;
}

/* Individual stream colors */
.si-netflix { background: #e50914; }
.si-youtube { background: #ff0000; }
.si-disney { background: #113ccf; }
.si-twitch { background: #9146ff; }
.si-tiktok { background: #010101; }
.si-spotify { background: #1db954; }
.si-gplay { background: #000000; }

/* Feature pills */
.features {
  display: flex;
  gap: 8px;
}

.pill {
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(37,99,235,0.08);
  border: 1px solid rgba(37,99,235,0.15);
  border-radius: 100px;
  padding: 5px 14px;
  font-size: 12px;
  color: #2563eb;
  font-weight: 600;
}

.pill svg { width: 14px; height: 14px; }

/* Right column: Phone */
.right {
  flex-shrink: 0;
  margin-left: 30px;
}

.phone-frame {
  width: 200px;
  height: 400px;
  background: #1a1a2e;
  border-radius: 28px;
  padding: 8px;
  box-shadow:
    0 20px 60px rgba(0,0,0,0.12),
    0 4px 16px rgba(0,0,0,0.06),
    inset 0 1px 0 rgba(255,255,255,0.1);
  position: relative;
  overflow: hidden;
}

.phone-screen {
  width: 100%;
  height: 100%;
  border-radius: 22px;
  overflow: hidden;
  background: white;
}

.phone-screen img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.phone-notch {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 72px;
  height: 18px;
  background: #1a1a2e;
  border-radius: 0 0 10px 10px;
  z-index: 2;
}

/* Bottom badge bar */
.bottom-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 44px;
  background: linear-gradient(90deg, #2563eb 0%, #3b82f6 50%, #6366f1 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  z-index: 2;
}

.badge-item {
  display: flex;
  align-items: center;
  gap: 6px;
  color: white;
  font-size: 12px;
  font-weight: 600;
}

.badge-item svg { width: 16px; height: 16px; }
.badge-number { font-size: 16px; font-weight: 800; }
</style>
</head>
